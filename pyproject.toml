[project]
name = "adr"
version = "0.4.1"
description = "This Python script is designed to help software development teams document their architecture decisions using Architecture Decision Records (ADRs)."
authors = [{ name = "Daniel Różycki", email = "altosterino@gmail.com" }]
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "typer==0.27.1",
    "loguru==0.7.3",
    "mako==1.4.1",
    "lidipy==0.3.2",
]

[project.scripts]
adr = "adrpy.entrypoints.cli:cli_entrypoint"

[dependency-groups]
dev = [
    "black>=26.5.1,<27",
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.4,<0.17",
]

[tool.hatch.build.targets.sdist]
include = ["src/adrpy"]

[tool.hatch.build.targets.wheel]
include = ["src/adrpy"]

[tool.hatch.build.targets.wheel.sources]
"src/adrpy" = "adrpy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line_length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_no_return = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "PL", "T20"]
ignore = ["PLC0415"]

[tool.pytest.ini_options]
addopts = ["--verbose"]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.uv]
required-version = "0.7.8"
